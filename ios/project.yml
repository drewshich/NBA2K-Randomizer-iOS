name: NBA2KRandomizer
options:
  bundleIdPrefix: personal.nba2k
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
targets:
  NBA2KRandomizer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.nba2k.randomizer
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NBA 2K Randomizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - NBA2KRandomizerTests
        - NBA2KRandomizerUITests
  NBA2KRandomizerTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: NBA2KRandomizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.nba2k.randomizer.tests
        GENERATE_INFOPLIST_FILE: YES
  NBA2KRandomizerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: NBA2KRandomizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.nba2k.randomizer.uitests
        GENERATE_INFOPLIST_FILE: YES
